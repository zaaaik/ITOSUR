# Configuración de despliegue para Render (Static Site).
# Si creas el sitio en Render como "Blueprint" (New + > Blueprint) apuntando
# a este repo, Render lee este archivo automáticamente y configura todo solo.
#
# Si en cambio creas el sitio a mano (New + > Static Site), Render NO lee
# este archivo — en ese caso agrega las mismas reglas manualmente en el
# dashboard del sitio, pestaña "Redirects/Rewrites" (ver la explicación
# que te dejo en el chat).

services:
  - type: web
    name: itosur
    env: static
    buildCommand: ""
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /quienes-somos
        destination: /quienes-somos.html
      - type: rewrite
        source: /nuestra-labor
        destination: /nuestra-labor.html
      - type: rewrite
        source: /que-hacemos
        destination: /que-hacemos.html
      - type: rewrite
        source: /proyecto-a-postular
        destination: /proyecto-a-postular.html
