  <rect x="822" y="165" width="150" height="70" fill="none" stroke="#9FB6C6" stroke-width="3"/>
  <line x1="822" y1="200" x2="972" y2="200" stroke="#9FB6C6" stroke-width="2"/>
  <line x1="897" y1="165" x2="897" y2="235" stroke="#9FB6C6" stroke-width="2"/>
  <rect x="822" y="255" width="120" height="10" fill="#D7DEE6"/>
  <rect x="822" y="272" width="90" height="10" fill="#D7DEE6"/>

  <!-- Escritorio 1 -->
  <g>
    <rect x="120" y="640" width="360" height="18" rx="4" fill="#8A6C4E"/>
    <rect x="140" y="658" width="14" height="120" fill="#6E5540"/>
