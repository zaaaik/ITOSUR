<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- ============================================================
       [PLACEHOLDER] Ilustración genérica de oficina.
       Reemplázala por una foto real cuando la tengas
       (ver img/hero_valdivia_poster.jpg como ejemplo de formato).
       ============================================================ -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8ECF1"/>
      <stop offset="100%" stop-color="#D7DEE6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE0F5"/>
      <stop offset="100%" stop-color="#E8F4FC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9B79C"/>
      <stop offset="100%" stop-color="#B29E80"/>
    </linearGradient>
  </defs>

  <!-- Pared y piso -->
  <rect x="0" y="0" width="1600" height="620" fill="url(#wall)"/>
  <rect x="0" y="620" width="1600" height="280" fill="url(#floor)"/>

  <!-- Ventanal grande con vista a casas (referencia al rubro) -->
  <rect x="90" y="80" width="620" height="440" rx="6" fill="url(#sky)" stroke="#9FB6C6" stroke-width="10"/>
  <line x1="400" y1="80" x2="400" y2="520" stroke="#9FB6C6" stroke-width="8"/>
  <line x1="90" y1="300" x2="710" y2="300" stroke="#9FB6C6" stroke-width="8"/>

  <!-- Casas simples a través de la ventana -->
  <g>
