    <rect x="1210" y="575" width="34" height="65" fill="#B7A088"/>
    <rect x="1250" y="575" width="34" height="65" fill="#005FAE"/>
    <rect x="1290" y="575" width="34" height="65" fill="#7C8B99"/>
    <rect x="1330" y="575" width="34" height="65" fill="#00457F"/>
