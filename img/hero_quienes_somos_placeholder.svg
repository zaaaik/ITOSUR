    <polygon points="135,380 195,330 255,380" fill="#005FAE"/>
    <rect x="175" y="420" width="30" height="50" fill="#7C8B99"/>

    <rect x="280" y="400" width="90" height="70" fill="#EFEAE0"/>
    <polygon points="275,400 325,360 375,400" fill="#00457F"/>
    <rect x="310" y="435" width="24" height="35" fill="#7C8B99"/>

    <rect x="450" y="390" width="120" height="80" fill="#F4EFE6"/>
    <polygon points="445,390 510,340 575,390" fill="#005FAE"/>
